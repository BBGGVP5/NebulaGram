name: android

# Builds the NebulaGram APK: Go core -> AAR, overlay + patches onto the pinned
# Telegram tree, credentials injected from secrets, then Gradle.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   TELEGRAM_APP_ID    — from my.telegram.org
#   TELEGRAM_APP_HASH  — from my.telegram.org
# See docs/BUILD-ANDROID.md.

on:
  workflow_dispatch:
    inputs:
      minify:
        description: 'Сжимать код R8. Выключите, чтобы проверить, не он ли ломает поведение'
        type: boolean
        default: true
  push:
    paths:
      - 'core/**'
      - 'bind/**'
      - 'runtime/**'
      - 'platform/android/**'
      - 'patches/android/**'
      - 'scripts/**'
      - '.github/workflows/android.yml'

# A push while a build is running makes the older one pointless: it can only
# produce an APK that is already out of date.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# The versions the pinned upstream asks for; a mismatch fails the native build.
env:
  NDK_VERSION: 27.2.12479018
  CMAKE_VERSION: 3.22.1

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Check the credentials are configured
        env:
          APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
        run: |
          if [ -z "$APP_ID" ]; then
            echo "::error::TELEGRAM_APP_ID and TELEGRAM_APP_HASH are not set. Register an app at my.telegram.org and add them as repository secrets — see docs/BUILD-ANDROID.md."
            exit 1
          fi

      - name: Choose the architectures
        run: |
          # Нативная часть — ffmpeg, webrtc, dav1d, opus — собирается заново под
          # каждую архитектуру и занимает больше половины времени сборки. На
          # обычный пуш хватает одной: arm64 стоит на любом телефоне не старше
          # десяти лет. Все четыре собираются по кнопке Run workflow, то есть
          # для релиза, и складываются в один универсальный APK.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "NEBULA_ABIS=armeabi-v7a,arm64-v8a,x86,x86_64" >> "$GITHUB_ENV"
            echo "NEBULA_KIND=universal" >> "$GITHUB_ENV"
          else
            echo "NEBULA_ABIS=arm64-v8a" >> "$GITHUB_ENV"
            echo "NEBULA_KIND=arm64-v8a" >> "$GITHUB_ENV"
          fi

      - name: Fetch the pinned upstream
        run: |
          git submodule update --init --depth 1 vendor/telegram-android
          # Telegram carries ten submodules of its own — ffmpeg, libvpx, dav1d,
          # opus, jlatexmath and the rest — and both the native build and the
          # Gradle configuration need every one of them present.
          git -C vendor/telegram-android submodule update --init --depth 1 --recursive

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: '**/go.sum'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install the NDK and CMake upstream pins
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: vendor/telegram-android
          cache-read-only: false

      - name: Build the NebulaLink core
        run: bash scripts/build-core.sh android

      - name: Prepare the tree
        run: bash scripts/apply-overlay.sh android

      - name: Install the credentials
        env:
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
        run: bash scripts/inject-keys.sh android

      - name: Assemble
        working-directory: vendor/telegram-android
        env:
          NEBULA_MINIFY: ${{ github.event_name == 'workflow_dispatch' && inputs.minify || 'true' }}
        run: |
          echo "архитектуры: $NEBULA_ABIS"
          # Maven Central отвечает 429, когда раннеры GitHub стучатся к нему
          # пачкой. Один повтор дешевле, чем потерянные двадцать минут сборки.
          for attempt in 1 2; do
            if ./gradlew --no-daemon -PnebulaAbis="$NEBULA_ABIS" -PnebulaMinify="$NEBULA_MINIFY"                 :TMessagesProj_AppStandalone:assembleAfatStandalone; then
              exit 0
            fi
            echo "::warning::попытка $attempt не удалась, повтор через 60 секунд"
            sleep 60
          done
          exit 1

      - name: Name the APK
        id: name
        run: |
          version=$(grep '^APP_VERSION_NAME=' vendor/telegram-android/gradle.properties | cut -d= -f2)
          echo "apk=NebulaGram-${version}-${NEBULA_KIND}-${GITHUB_SHA::7}.apk" >> "$GITHUB_OUTPUT"

      - name: Collect the APK
        run: |
          # Тип сборки standalone, а не release: release у этого модуля не
          # объявлен, Gradle создаёт его по умолчанию и без подписи, а
          # неподписанный APK Android не ставит.
          #
          # Каталог у AGP складывается из флейвора и типа через косую черту —
          # apk/afat/standalone, а не afatStandalone. По имени задачи файл не
          # находился, и готовая сборка выбрасывалась на последнем шаге.
          found=$(find vendor/telegram-android -path '*/outputs/apk/afat/standalone/*' -name 'app.apk' | head -1)
          test -n "$found" || { echo "::error::APK не собрался"; exit 1; }
          mkdir -p out && cp "$found" "out/${{ steps.name.outputs.apk }}"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: nebulagram-apk
          path: out/*.apk
          if-no-files-found: error
